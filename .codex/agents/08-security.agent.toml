Threat considered: ...\r
\r
## Completed\r
...\r
\r
## Files Changed\r
- ...\r
\r
## Validation\r
- `pnpm lint`: ...\r
- `pnpm typecheck`: ...\r
- Manual auth/role check exercised: ...\r
\r
## Risks / Follow-ups\r
...\r
```"""
