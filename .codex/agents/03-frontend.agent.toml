...\r
\r
## Files Changed\r
- ...\r
\r
## Validation\r
- `pnpm lint`: ...\r
- `pnpm typecheck`: ...\r
- Manual check: ...\r
\r
## Risks / Follow-ups\r
...\r
```"""
