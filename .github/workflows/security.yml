name: Security Agent

on:
  push:
    branches: [main, develop]
  pull_request:
    # Was [main] only, so a PR targeting develop ran no security workflow at all.
    branches: [main, develop]
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ─── CODEQL SAST ────────────────────────────────────────────────────────────
  # NOT a blocking check, despite how it reads. `codeql-action/analyze` has no
  # `fail-on` input: it uploads results to code scanning and exits 0 whatever it
  # found. A green tick here means "analysis completed", never "no alerts".
  # Turning alerts into a merge blocker requires enabling the code-scanning
  # branch-protection rule in repository settings — configuration that does not
  # live in this repo and cannot be asserted from it.
  #
  # It also would not have caught the IDOR family regardless. Broken access
  # control is a missing check, and no static analyser can know which endpoints
  # were supposed to have one. See the route-authorization job below.
  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  # ─── DEPENDENCY VULNERABILITY AUDIT ─────────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high severity)
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Run pnpm audit (full report)
        run: pnpm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report-${{ github.sha }}
          path: audit-report.json
          retention-days: 30

  # ─── SECRET SCANNING ────────────────────────────────────────────────────────
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── DEPENDENCY REVIEW (PR only) ────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1
          # The prebuilt libvips binaries that sharp loads are LGPL-3.0-or-later
          # and have been in this tree for as long as Next.js has (main ships
          # @img/sharp-libvips-*@1.2.4 under the same licence). They surface here
          # only because a version bump makes them "changed" in the diff, and
          # because dependency review itself started working once the repository
          # dependency graph was enabled.
          #
          # Exempted by name rather than by widening deny-licenses: allowing
          # LGPL-3.0 wholesale would silently accept the next such package too.
          # LGPL permits use without the copyleft reaching this application, and
          # these are unmodified upstream binaries — but that is a licensing
          # judgement, so it is written down here rather than assumed.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64
          comment-summary-in-pr: always

  # ─── SECURITY HEADERS CHECK ─────────────────────────────────────────────────
  # The push-to-main-only gate was removed. A check that runs only after a merge
  # cannot block the merge, so for every pull request this job did not exist.
  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Next.js security headers config
        run: |
          echo "=== Checking next.config.ts for security headers ==="
          if grep -q "Content-Security-Policy\|X-Frame-Options\|X-Content-Type-Options" next.config.ts; then
            echo "✅ Security headers found in next.config.ts"
          else
            echo "::warning::Security headers not configured in next.config.ts. Consider adding CSP, X-Frame-Options, etc."
          fi

  # ─── HARDCODED SECRETS ──────────────────────────────────────────────────────
  # Replaces an inline grep that could not fail. Its pattern required
  # `password =`, so the vulnerable `password:` object property never matched,
  # and it was gated to push-on-main so it never ran on a pull request. Both
  # problems are fixed here: a real, locally testable script, run on every PR.
  hardcoded-secrets:
    name: Hardcoded Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan for hardcoded secrets
        run: node scripts/quality/check-hardcoded-secrets.mjs

  # ─── ROUTE AUTHORIZATION MANIFEST ───────────────────────────────────────────
  # The gap that let the IDOR family reach production: nothing in CI could tell
  # "public by design" from "forgot the check", because a missing authorization
  # check has no syntactic signature for a scanner to find. This does not detect
  # vulnerabilities — it requires every route to have a *declared* posture, so
  # omissions surface as a diff against a CODEOWNERS-owned file.
  route-authorization:
    name: Route Authorization Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check every route has a declared authorization posture
        run: node scripts/quality/check-route-authorization.mjs

  # ─── OWASP ZAP BASELINE (scheduled only) ────────────────────────────────────
  owasp-zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          issue_title: 'OWASP ZAP Baseline Scan Report'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false

  # ─── SECURITY SUMMARY REPORT ────────────────────────────────────────────────
  security-report:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, secret-scanning, hardcoded-secrets, route-authorization]
    if: always()
    steps:
      - name: Security scan summary
        uses: actions/github-script@v7
        with:
          script: |
            const auditStatus     = '${{ needs.dependency-audit.result }}';
            const secretStatus    = '${{ needs.secret-scanning.result }}';
            const hardcodedStatus = '${{ needs.hardcoded-secrets.result }}';
            const authzStatus     = '${{ needs.route-authorization.result }}';

            const icon = (r) => r === 'success' ? '✅ Passed' : '❌ Failed';

            const body = `## 🔒 Security Scan Summary

            | Check | Status |
            |-------|--------|
            | Dependency Audit | ${icon(auditStatus)} |
            | Secret Scanning (Gitleaks) | ${icon(secretStatus)} |
            | Hardcoded Secrets | ${icon(hardcodedStatus)} |
            | Route Authorization Manifest | ${icon(authzStatus)} |

            > CodeQL is **not** listed here: \`codeql-action/analyze\` has no
            > \`fail-on\` input and exits 0 regardless of what it finds. Whether a
            > CodeQL alert blocks a merge is a branch-protection setting in the
            > repository, not something this workflow can assert.

            *Run triggered by: ${{ github.actor }} on ${{ github.ref_name }}*`;
            
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              core.info(body);
            }
